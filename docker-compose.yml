services:
  minutes-bot:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    container_name: rocky-minutes-bot
    env_file: .env
    restart: unless-stopped
    # Give the bot time to finish and save an in progress recording on stop.
    stop_grace_period: 90s
    volumes:
      - ./data:/data
      - whisper-models:/models
    # Whisper is CPU heavy. Raise if you pick a bigger model.
    deploy:
      resources:
        limits:
          cpus: "10"
          memory: 8g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  whisper-models:
